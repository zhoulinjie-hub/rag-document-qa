name: interview-demo

services:
  app:
    build:
      context: .
    init: true
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      PORT: "8000"
    volumes:
      - rag-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  rag-data:
